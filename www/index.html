<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a12"><title>GoldNews AI</title>
<style>
:root{--gold:#f5c451;--gold2:#ff9f1c;--blue:#5cc8ff;--up:#2ee59d;--dn:#ff5d73;--mu:#8da2b8;--tx:#eef3f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#060a12;color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 130px;overflow-x:hidden}
.blob{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{background:#f5c451;top:-80px;right:-100px}.b2{background:#1a8cff;bottom:-80px;left:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(-40px,60px) scale(1.2)}}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:18px;margin:14px 16px;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{padding:22px 20px 6px}.hero small{color:var(--mu);letter-spacing:.14em;font-size:12px}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--up);margin-right:8px;animation:pu 1.4s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(46,229,157,.7)}100%{box-shadow:0 0 0 12px rgba(46,229,157,0)}}
.px{font:800 46px/1.1 system-ui;background:linear-gradient(135deg,#fff0b8,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0;letter-spacing:-1px}
.chg{font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(245,196,81,.15);color:var(--gold);letter-spacing:.06em}
.cd{font:800 34px monospace;background:linear-gradient(90deg,var(--blue),#b388ff);-webkit-background-clip:text;background-clip:text;color:transparent}
input,select{width:100%;margin-top:10px;padding:15px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3);color:var(--tx);font:inherit}
button{width:100%;margin-top:12px;min-height:58px;border:0;border-radius:18px;font:700 17px system-ui;color:#1a1200;background:linear-gradient(135deg,#ffe08a,var(--gold),var(--gold2));box-shadow:0 8px 24px rgba(245,196,81,.3);transition:transform .15s,filter .15s}
button:active{transform:scale(.95);filter:brightness(1.15)}button.s{background:rgba(255,255,255,.08);color:var(--tx);box-shadow:none}
nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:8px;border-radius:26px;background:rgba(14,20,32,.85);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.5)}
nav a{flex:1;text-align:center;padding:10px 0;border-radius:20px;color:var(--mu);font-size:12px;font-weight:700;transition:all .25s}
nav svg{display:block;margin:0 auto 4px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav a.on{background:linear-gradient(135deg,rgba(245,196,81,.25),rgba(255,159,28,.12));color:var(--gold);transform:translateY(-3px)}nav a:active{transform:scale(.9)}
.tab{display:none}.tab.on{display:block}.foot{text-align:center;margin:20px 0}.foot a{color:var(--mu);text-decoration:none}
.gauge{width:100%;max-width:340px;display:block;margin:0 auto}#needle{transition:transform 1.2s cubic-bezier(.2,1.4,.4,1);transform-origin:150px 150px}
.err{border:1px solid rgba(255,93,115,.45);background:rgba(255,93,115,.1);border-radius:16px;padding:14px;color:var(--tx);line-height:1.5}.err b{color:var(--dn);display:block;margin-bottom:2px}.okm{border:1px solid rgba(46,229,157,.45);background:rgba(46,229,157,.1);border-radius:16px;padding:14px;color:var(--up);font-weight:700}
.big{font:800 26px system-ui;text-align:center;margin:4px 0}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="hero"><small><span class="live"></span>XAU/USD · EN VIVO</small><div class="px" id="px">--</div><div class="chg" id="chg"></div></div>

<section class="tab on" id="t-cal"><div id="cal"></div></section>
<section class="tab" id="t-bias"><div id="bias"></div></section>
<section class="tab" id="t-sig"><div id="sig"></div></section>
<section class="tab" id="t-api">
 <div class="glass"><b>Clave API para análisis IA</b><div class="mu">Se guarda solo en tu teléfono.</div>
 <select id="prov"><option value="claude">Claude (Anthropic)</option><option value="gemini">Gemini (Google)</option></select>
 <input id="key" type="password" placeholder="Pega tu clave API"><button onclick="saveKey()">Guardar y verificar clave</button><div id="ks" style="margin-top:12px"></div></div>
 <div class="glass"><b>Alertas</b><div class="mu">Aviso 15 minutos antes de cada noticia.</div><button class="s" onclick="enableAlerts()">Activar alertas</button><div class="mu" id="am" style="margin-top:8px"></div></div>
 <div class="glass mu">Aviso: contenido informativo, no es asesoría financiera. Operar conlleva riesgo de pérdida.</div>
 <div class="foot"><a href="https://presentacion-olive.vercel.app" target="_blank" rel="noopener">© Geremy 2024 - 2026</a></div></section>

<nav>
 <a class="on" data-t="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Noticias</a>
 <a data-t="bias"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Sesgo</a>
 <a data-t="sig"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Señal</a>
 <a data-t="api"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>API</a>
</nav>
<script>
const $=id=>document.getElementById(id),LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const KEYEV=/non-farm|cpi|fomc|federal funds|ppi|gdp|ism|pmi|retail sales|unemployment|jobless|pce|powell|fed chair|rate statement/i,INVERSE=/unemployment|jobless/i;
let events=[],price=null;
const http=async(url,opt={})=>{const C=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
 if(C&&Capacitor.isNativePlatform()){const r=await C.request({url,method:opt.method||'GET',headers:opt.headers||{},data:opt.body?JSON.parse(opt.body):undefined});return r.data}
 const r=await fetch(url,opt);return r.json()};
const key=e=>e.title+e.date;
const num=s=>{if(s==null||s==='')return NaN;const m=String(s).replace(/,/g,'').match(/-?\d+(\.\d+)?/);if(!m)return NaN;let v=parseFloat(m[0]);if(/K/i.test(s))v*=1e3;if(/M/i.test(s))v*=1e6;if(/B/i.test(s))v*=1e9;return v};
function ruleBias(e){const a=num(LS('act',{})[key(e)]),f=num(e.forecast);if(isNaN(a)||isNaN(f))return null;const sur=(a-f)/(Math.abs(f)||1),dir=(INVERSE.test(e.title)?1:-1)*Math.sign(sur);return{dir,score:dir*Math.max(.5,Math.min(3,Math.round(Math.abs(sur)*20)/2))}}
const lbl=d=>d>0?'<span class="up">ALCISTA ▲</span>':d<0?'<span class="dn">BAJISTA ▼</span>':'NEUTRAL';
function agg(){const d=events.map(e=>({e,b:ruleBias(e)})).filter(x=>x.b&&x.e.t>Date.now()-864e5);const s=d.reduce((a,x)=>a+x.b.score,0);return{s,n:d.length,dir:Math.sign(s)}}

async function loadEvents(){let all=[];for(const w of['thisweek','nextweek']){try{const d=await http(`https://nfs.faireconomy.media/ff_calendar_${w}.json`);if(Array.isArray(d))all=all.concat(d)}catch(e){}}
 if(all.length)SV('ev',all);else all=LS('ev',[]);
 events=all.filter(e=>e.country==='USD'&&e.impact==='High'&&KEYEV.test(e.title)).map(e=>({...e,t:new Date(e.date).getTime()})).sort((a,b)=>a.t-b.t)}
async function loadPrice(){try{const d=await http('https://api.gold-api.com/price/XAU');price=d.price;SV('lp',price)}catch(e){price=LS('lp',null)}
 if(price){$('px').textContent=price.toFixed(2);if(LS('openDay','')!==new Date().toDateString()){SV('open',price);SV('openDay',new Date().toDateString())}
 const dd=price-LS('open',price);$('chg').innerHTML=`<span class="${dd>=0?'up':'dn'}">${dd>=0?'▲':'▼'} ${Math.abs(dd).toFixed(2)} hoy</span>`;renderSig()}}

function renderCal(){const list=events.filter(e=>e.t>Date.now()-864e5*2).slice(0,25),nx=events.find(e=>e.t>Date.now());
 $('cal').innerHTML=(nx?`<div class="glass"><div class="row"><span class="mu">PRÓXIMA NOTICIA</span><span class="chip">HIGH</span></div><b style="font-size:19px">${nx.title}</b><div class="cd" id="cd">--</div></div>`:'')+
 list.map(e=>{const b=ruleBias(e);return`<div class="glass"><div class="row"><b>${e.title}</b><span class="chip">HIGH</span></div>
 <div class="mu">${new Date(e.t).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · Previo ${e.previous||'-'} · Consenso ${e.forecast||'-'}</div>
 <input placeholder="Dato real (ej. 3.2% / 215K)" value="${LS('act',{})[key(e)]||''}" onchange="setAct(this.dataset.k,this.value)" data-k="${key(e).replace(/"/g,'&quot;')}">
 ${b?`<div style="margin-top:10px;font-weight:800">${lbl(b.dir)}</div>`:''}</div>`}).join('')||'<div class="glass mu">Sin eventos.</div>'}
function setAct(k,v){const a=LS('act',{});a[k]=v;SV('act',a);renderAll()}

function renderBias(){const g=agg(),ang=Math.max(-3,Math.min(3,g.s))/3*80;
 $('bias').innerHTML=`<div class="glass"><b>Sesgo del oro</b>
 <svg class="gauge" viewBox="0 0 300 170"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".5" stop-color="#f5c451"/><stop offset="1" stop-color="#2ee59d"/></linearGradient></defs>
 <path d="M30 150A120 120 0 0 1 270 150" fill="none" stroke="url(#gg)" stroke-width="22" stroke-linecap="round"/>
 <g id="needle" style="transform:rotate(${ang}deg)"><line x1="150" y1="150" x2="150" y2="52" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="150" r="10" fill="#fff"/></g>
 <text x="30" y="168" fill="#8da2b8" font-size="12">BAJISTA</text><text x="222" y="168" fill="#8da2b8" font-size="12">ALCISTA</text></svg>
 <div class="big">${g.n?lbl(g.dir):'<span class="mu">Esperando datos</span>'}</div>
 <div class="mu" style="text-align:center">${g.n?`Basado en ${g.n} noticia(s) con dato real`:'Escribe el dato real de una noticia en Noticias para calcularlo.'}</div></div>
 <div class="glass"><b>Análisis IA</b>${LS('ck','')?`<button onclick="runAI()">Analizar con IA</button><div id="aiout" class="mu" style="white-space:pre-wrap;margin-top:10px">${LS('aiout','')}</div>`:'<div class="mu" style="margin-top:8px">Añade tu clave en la pestaña API para activar el análisis.</div>'}</div>`}
const GEMINI_MODELS=['gemini-3.8-flash','gemini-2.5-flash'];
const httpRaw=async(url,opt={})=>{const C=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
 if(C&&Capacitor.isNativePlatform()){const r=await C.request({url,method:opt.method||'GET',headers:opt.headers||{},data:opt.body?JSON.parse(opt.body):undefined});return{status:r.status,data:r.data}}
 const r=await fetch(url,opt);let d=null;try{d=await r.json()}catch(e){}return{status:r.status,data:d}};
function aiErr(prov,status,data,thrown){const n=prov==='gemini'?'Gemini':'Claude',raw=JSON.stringify(data||'').toLowerCase();let t,m;
 if(thrown){t='Sin conexión';m='No se pudo contactar con '+n+'. Revisa tu internet e inténtalo de nuevo.'}
 else if(status===401||/api key not valid|api_key_invalid|invalid x-api-key|authentication_error|invalid api key/.test(raw)){t='Clave API no válida';m='La clave de '+n+' es incorrecta o fue revocada. Revísala en la pestaña API.'}
 else if(status===403||/permission/.test(raw)){t='Acceso denegado';m='Tu clave no tiene permiso para usar este servicio. Verifica que esté activa y habilitada.'}
 else if(/credit balance|billing/.test(raw)){t='Sin saldo';m='Tu cuenta de '+n+' no tiene crédito disponible. Recarga saldo o usa otra clave.'}
 else if(status===429||/quota|rate.?limit|resource_exhausted/.test(raw)){t='Límite de uso alcanzado';m='Superaste el límite de consultas de tu clave. Espera unos minutos e inténtalo otra vez.'}
 else if(status===404||/not.?found|no longer available/.test(raw)){t='Modelo no disponible';m='El modelo de IA fue retirado o cambió de nombre. Actualiza la app para continuar.'}
 else if(status>=500||/overloaded/.test(raw)){t='Servicio saturado';m=n+' tiene alta demanda en este momento. Inténtalo en unos minutos.'}
 else if(status===400){t='Solicitud rechazada';m='El servicio no aceptó la consulta. Verifica tu clave e inténtalo de nuevo.'}
 else{t='Error inesperado';m='No se pudo completar el análisis. Inténtalo de nuevo.'}
 return{t,m}}
async function callAI(sys,usr,max,allowEmpty){const prov=LS('pv','claude'),k=LS('ck','');if(!k)throw{t:'Falta la clave',m:'Añade tu clave API en la pestaña API.'};let res;
 try{if(prov==='gemini'){for(const mod of GEMINI_MODELS){res=await httpRaw(`https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:usr}]}],generationConfig:{maxOutputTokens:max}})});if(res.status!==404)break}}
 else res=await httpRaw('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:max,system:sys,messages:[{role:'user',content:usr}]})})}
 catch(e){throw aiErr(prov,0,null,true)}
 if(res.status<200||res.status>=300)throw aiErr(prov,res.status,res.data);
 const d=res.data||{},text=prov==='gemini'?(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''):(d.content||[]).map(c=>c.text||'').join('');
 if(!text.trim()&&!allowEmpty)throw{t:'Sin respuesta',m:'La IA no devolvió contenido. Inténtalo de nuevo en unos segundos.'};return text}
const showErr=(el,e)=>{const x=e&&e.t?e:{t:'Error inesperado',m:'No se pudo completar la operación. Inténtalo de nuevo.'};el.innerHTML=`<div class="err"><b>${x.t}</b>${x.m}</div>`};
async function runAI(){const out=$('aiout');out.className='mu';out.textContent='Analizando...';
 const ev=events.filter(e=>Math.abs(e.t-Date.now())<864e5*2).map(e=>({t:e.title,fecha:e.date,previo:e.previous,consenso:e.forecast,real:LS('act',{})[key(e)]||null}));
 const sys='Eres analista macro de oro (XAUUSD). Responde en español, máximo 120 palabras: sesgo (ALCISTA/BAJISTA/NEUTRAL), confianza (baja/media/alta), razón breve y riesgo clave. Sin asegurar resultados.',usr=`Precio XAUUSD: ${price}. Eventos USD: ${JSON.stringify(ev)}`;
 try{const t=await callAI(sys,usr,600);SV('aiout',t);out.className='mu';out.style.whiteSpace='pre-wrap';out.textContent=t}catch(e){showErr(out,e)}}

function renderSig(){const g=agg(),sw=Math.abs(g.s)>=2&&price;
 $('sig').innerHTML=`<div class="glass"><b>Dirección XAUUSD hoy</b><div class="big" style="margin-top:10px">${g.n?lbl(g.dir):'<span class="mu">Esperando datos</span>'}</div><div class="mu" style="text-align:center">Se calcula con las noticias que tienen dato real.</div></div>
 <div class="glass"><b>Signal Swing</b><div class="mu">No es diaria: solo con sesgo fuerte. 1 pip = 0.10 USD.</div>
 ${sw?(()=>{const d=g.dir;return`<div style="margin-top:12px;font-size:17px;line-height:1.7"><b class="${d>0?'up':'dn'}" style="font-size:24px">${d>0?'BUY':'SELL'}</b> @ ${price.toFixed(2)}<br>SL ${(price-d*20).toFixed(2)} (200 pips)<br>TP ${(price+d*40).toFixed(2)} (400 pips) · R:R 1:2</div>`})():'<div style="margin-top:12px">Sin señal por ahora.</div>'}</div>`}
async function saveKey(){const v=$('key').value.trim(),o=$('ks');if(!v){showErr(o,{t:'Campo vacío',m:'Pega tu clave API antes de guardar.'});return}
 SV('ck',v);SV('pv',$('prov').value);$('key').value='';o.innerHTML='<div class="mu">Verificando clave...</div>';
 try{await callAI('Responde solo: OK','ping',50,true);o.innerHTML='<div class="okm">Clave verificada correctamente</div>'}catch(e){showErr(o,e)}renderAll()}

const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function enableAlerts(){const L=LN();if(!L){$('am').textContent='Alertas solo en la app Android.';return}const r=await L.requestPermissions();$('am').textContent=r.display==='granted'?'Alertas activadas':'Permiso denegado';scheduleAlerts()}
async function scheduleAlerts(){const L=LN();if(!L)return;try{const p=await L.checkPermissions();if(p.display!=='granted')return;const pend=await L.getPending();if(pend.notifications.length)await L.cancel({notifications:pend.notifications});
 const ns=events.filter(e=>e.t-9e5>Date.now()).slice(0,60).map((e,i)=>({id:i+1,title:e.title+' en 15 min',body:'Alto impacto USD · volatilidad en XAUUSD',schedule:{at:new Date(e.t-9e5),allowWhileIdle:true}}));if(ns.length)await L.schedule({notifications:ns})}catch(e){}}
setInterval(()=>{const nx=events.find(e=>e.t>Date.now()),c=$('cd');if(!nx||!c)return;const s=Math.floor((nx.t-Date.now())/1e3),d=Math.floor(s/86400);c.textContent=(d?d+'d ':'')+String(Math.floor(s%86400/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);

function renderAll(){renderCal();renderBias();renderSig()}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a,.tab').forEach(x=>x.classList.remove('on'));a.classList.add('on');$('t-'+a.dataset.t).classList.add('on')});
$('prov').value=LS('pv','claude');
(async()=>{await loadEvents();renderAll();loadPrice();setInterval(loadPrice,2e4);setInterval(async()=>{await loadEvents();renderAll()},9e5);scheduleAlerts()})();
</script></body></html>
